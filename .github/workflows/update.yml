name: Update LG Electronics DART data
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'legacy/**'
      - 'docs/data/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate DART API key
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: test -n "$DART_API_KEY" || (echo "DART_API_KEY secret is missing"; exit 1)
      - name: Collect and analyze
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/dart_agent.py
      - name: Prepare dashboard data for Pages
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          source = Path("data/processed/dashboard.json")
          if not source.is_file():
              raise SystemExit("Missing data/processed/dashboard.json")
          data = json.loads(source.read_text(encoding="utf-8"))
          if not isinstance(data, dict) or not isinstance(data.get("annual"), list) or not data["annual"]:
              raise SystemExit("Dashboard JSON is invalid or contains no annual data")

          target = Path("docs/data/processed")
          target.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source, target / "dashboard.json")
          last_update = Path("data/processed/last_update.json")
          if last_update.is_file():
              shutil.copy2(last_update, target / "last_update.json")
          print(f"Prepared dashboard with {len(data['annual'])} annual rows")
          PY
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw data/processed legacy docs/data/processed
          git diff --cached --quiet || git commit -m 'chore(data): update LG Electronics DART financials'
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4