name: Update LG Electronics DART data
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'legacy/**'
permissions:
  contents: write
concurrency:
  group: dart-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate DART API key
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: test -n "$DART_API_KEY" || (echo "DART_API_KEY secret is missing"; exit 1)
      - name: Collect and analyze
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/dart_agent.py
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw data/processed legacy
          git diff --cached --quiet || git commit -m 'chore(data): update LG Electronics DART financials'
          git push